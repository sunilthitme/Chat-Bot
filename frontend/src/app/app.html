<main class="app-shell" [class.dark]="darkMode()">
  <aside class="sidebar" aria-label="Chat sessions">
    <button class="new-chat" type="button" (click)="newChat()" [disabled]="isSidebarLoading()">
      + New chat
    </button>

    <div class="session-list">
      <button
        *ngFor="let session of sessions()"
        type="button"
        class="session-item"
        [class.active]="session.id === currentSessionId()"
        (click)="selectSession(session)"
      >
        <span>{{ session.title }}</span>
        <small>{{ session.privateMode ? 'Private' : 'Saved' }}</small>
      </button>
    </div>
  </aside>

  <section class="chat-window" aria-label="Internal chatbot">
    <header class="chat-header">
      <div>
        <h1>Internal Chatbot</h1>
        <p>DB-first RAG assistant</p>
      </div>
      <div class="header-actions">
        <button
          class="private-toggle"
          type="button"
          [class.active]="privateMode()"
          [attr.aria-pressed]="privateMode()"
          (click)="togglePrivateMode()"
        >
          {{ privateMode() ? 'Private on' : 'Private off' }}
        </button>
        <button class="theme-toggle" type="button" (click)="toggleTheme()">
          {{ darkMode() ? 'Light' : 'Dark' }}
        </button>
        <span class="status">Online</span>
      </div>
    </header>

    <div class="tool-strip">
      <label class="upload-button">
        Upload
        <input type="file" accept=".pdf,.docx,.txt,.log,.csv" (change)="uploadDocument($event)" hidden>
      </label>
      <div *ngIf="uploadProgress() > 0" class="upload-progress">
        <span [style.width.%]="uploadProgress()"></span>
      </div>

      <form class="url-form" (ngSubmit)="ingestUrl()">
        <input
          type="url"
          name="url"
          [(ngModel)]="urlInput"
          placeholder="Read allowed URL"
          [disabled]="isLoading()"
        >
        <button type="submit" [disabled]="isLoading() || !urlInput.trim()">Read</button>
      </form>
    </div>

    <div class="messages" #messagesContainer>
      <div
        *ngFor="let message of messages()"
        class="message-row"
        [class.user-row]="message.sender === 'user'"
        [class.bot-row]="message.sender === 'bot'"
      >
        <div class="message-bubble">
          <div class="message-content" [innerHTML]="renderMarkdown(message.text)"></div>
          <div *ngIf="message.sources?.length" class="sources">
            <strong>Sources</strong>
            <span *ngFor="let source of message.sources">
              {{ source.sourceName }}
              <ng-container *ngIf="source.pageNumber"> page {{ source.pageNumber }}</ng-container>
              <ng-container *ngIf="source.sectionTitle"> - {{ source.sectionTitle }}</ng-container>
              - {{ source.score | number:'1.2-2' }}
            </span>
          </div>
        </div>
      </div>

      <div *ngIf="isLoading()" class="message-row bot-row">
        <div class="message-bubble loading">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <form class="chat-form" (ngSubmit)="sendMessage()">
      <input
        type="text"
        name="message"
        [(ngModel)]="userInput"
        placeholder="Ask about internal knowledge, uploaded docs, or trusted URLs"
        autocomplete="off"
        [disabled]="isLoading()"
      >
      <button type="submit" [disabled]="isLoading() || !userInput.trim()">Send</button>
    </form>
  </section>
</main>
