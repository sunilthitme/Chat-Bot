<main class="page">
  <section class="chat-window" aria-label="Internal chatbot">
    <header class="chat-header">
      <div>
        <h1>Internal Chatbot</h1>
        <p>Application help desk</p>
      </div>
      <div class="header-actions">
        <span class="status">Online</span>
        <div class="mode-toggle" aria-label="Response mode">
          <button
            type="button"
            [class.active]="responseMode() === 'internal'"
            [attr.aria-pressed]="responseMode() === 'internal'"
            [disabled]="isLoading()"
            (click)="setResponseMode('internal')"
          >
            Internal
          </button>
          <button
            type="button"
            [class.active]="responseMode() === 'llm'"
            [attr.aria-pressed]="responseMode() === 'llm'"
            [disabled]="isLoading()"
            (click)="setResponseMode('llm')"
          >
            LLM
          </button>
        </div>
      </div>
    </header>

    <div class="messages" #messagesContainer>
      <div
        *ngFor="let message of messages()"
        class="message-row"
        [class.user-row]="message.sender === 'user'"
        [class.bot-row]="message.sender === 'bot'"
      >
        <div class="message-bubble">
          {{ message.text }}
        </div>
      </div>

      <div *ngIf="isLoading()" class="message-row bot-row">
        <div class="message-bubble loading">Typing...</div>
      </div>
    </div>

    <form class="chat-form" (ngSubmit)="sendMessage()">
      <input
        type="text"
        name="message"
        [(ngModel)]="userInput"
        [placeholder]="placeholderText()"
        autocomplete="off"
        [disabled]="isLoading()"
      >
      <button type="submit" [disabled]="isLoading() || !userInput.trim()">Send</button>
    </form>
  </section>
</main>
