<main class="app-shell" [class.dark]="darkMode()">
  <aside class="sidebar" aria-label="Chat sessions">
    <button class="new-chat" type="button" (click)="newChat()" [disabled]="isSidebarLoading() || indexingActive()">
      + New chat
    </button>

    <div class="session-list">
      <button
        *ngFor="let session of sessions()"
        type="button"
        class="session-item"
        [class.active]="session.id === currentSessionId()"
        [disabled]="indexingActive()"
        (click)="selectSession(session)"
      >
        <span>{{ session.title }}</span>
        <small>{{ session.activeDocumentName || (session.privateMode ? 'Private' : 'Saved') }}</small>
      </button>
    </div>
  </aside>

  <section class="chat-window" aria-label="Internal chatbot">
    <header class="chat-header">
      <div>
        <h1>Internal Chatbot</h1>
        <p>{{ activeDocumentLabel() }}</p>
      </div>
      <div class="header-actions">
        <button
          class="private-toggle"
          type="button"
          [class.active]="privateMode()"
          [attr.aria-pressed]="privateMode()"
          (click)="togglePrivateMode()"
        >
          {{ privateMode() ? 'Private on' : 'Private off' }}
        </button>
        <button class="theme-toggle" type="button" (click)="toggleTheme()">
          {{ darkMode() ? 'Light' : 'Dark' }}
        </button>
        <span class="status">Online</span>
      </div>
    </header>

    <div class="tool-strip">
      <label class="upload-button" [class.disabled]="isLoading() || indexingActive()">
        Upload
        <input type="file" accept=".pdf,.docx,.txt,.log,.csv,.java,.xml,.properties,.yml,.yaml,.json" (change)="uploadDocument($event)" [disabled]="isLoading() || indexingActive()" hidden>
      </label>
      <div *ngIf="uploadProgress() > 0" class="upload-progress">
        <span [style.width.%]="uploadProgress()"></span>
      </div>

      <form class="url-form" (ngSubmit)="ingestUrl()">
        <input
          type="url"
          name="url"
          [(ngModel)]="urlInput"
          placeholder="Index public webpage"
          [disabled]="isLoading() || indexingActive()"
        >
        <button type="submit" [disabled]="isLoading() || indexingActive() || !urlInput.trim()">Index</button>
      </form>
    </div>

    <section *ngIf="indexingActive()" class="indexing-panel" aria-live="polite">
      <span class="indexing-dot"></span>
      <div>
        <strong>{{ indexingStage() }}</strong>
        <p>{{ indexingMessage() }}</p>
      </div>
    </section>

    <div class="messages" #messagesContainer>
      <div
        *ngFor="let message of messages()"
        class="message-row"
        [class.user-row]="message.sender === 'user'"
        [class.bot-row]="message.sender === 'bot'"
      >
        <div class="message-bubble">
          <div class="message-content" [innerHTML]="renderMarkdown(message.text)"></div>
          <div *ngIf="message.sources?.length" class="source-list">
            <span class="source-label">Sources</span>
            <span *ngFor="let source of message.sources" class="source-chip">
              {{ source.title }}<ng-container *ngIf="source.pageNumber"> p.{{ source.pageNumber }}</ng-container>
            </span>
          </div>
        </div>
      </div>

      <div *ngIf="isLoading()" class="message-row bot-row">
        <div class="message-bubble loading">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <form class="chat-form" (ngSubmit)="sendMessage()">
      <input
        type="text"
        name="message"
        [(ngModel)]="userInput"
        (ngModelChange)="onUserInputChange($event)"
        placeholder="Ask about internal knowledge, uploaded docs, or indexed webpages"
        autocomplete="off"
        [disabled]="isLoading() || indexingActive()"
      >
      <button type="submit" [disabled]="isLoading() || indexingActive() || !debouncedInput()">Send</button>
    </form>
  </section>
</main>
