# Application name shown in logs.
spring.application.name=internal-chatbot

# H2 file database for local persistence in restricted corporate environments.
spring.datasource.url=jdbc:h2:file:./data/chatbotdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep persisted local knowledge instead of recreating tables on every restart.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Load sample data after Hibernate creates the table.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Enables browser console at http://localhost:8080/h2-console.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Backend server port.
server.port=8080
server.tomcat.connection-timeout=30s
spring.mvc.async.request-timeout=240s

# Frontend origin allowed to call backend APIs.
app.cors.allowed-origin=http://localhost:4200

# Ollama remains only for the existing local embedding pipeline.
ollama.enabled=true
ollama.base-url=http://localhost:11434
ollama.embedding-model=nomic-embed-text
ollama.embedding-timeout=45s

# RAG storage uses only H2 JSON embeddings, in-process Java cosine similarity, and Apache Lucene BM25.
rag.top-k=3
rag.candidate-top-k=24
rag.local-candidate-limit=800
rag.allow-global-retrieval=false
rag.intent-filter-threshold=0.72
rag.low-confidence-score=0.75
rag.answer-confidence-threshold=0.62
rag.minimum-top-score=0.42
rag.neighbor-expansion-limit=1
rag.expanded-candidate-limit=32
rag.lucene.rebuild-on-startup=true
rag.retrieval-cache-size=128
rag.chunk-size=800
rag.chunk-overlap=150
rag.min-score=0.05
rag.max-context-chars=2200
rag.max-chunk-context-chars=650
rag.embedding-batch-size=12
rag.embedding-cache-size=512

# Chat runtime guardrails: bounded search, one generation call, and long enough SSE for hosted model calls.
chat.internal-search-limit=3
chat.answer-cache-size=256
chat.request-timeout=240s
chat.sse-timeout=240s
chat.memory.max-chars=1800
chat.memory.retrieval-query-chars=600
chat.memory.long-term-limit=8
chat.memory.long-term-max-chars=1200
ingestion.summary.max-input-chars=6000

# Upload guardrails.
security.max-upload-bytes=10485760

# URL ingestion crawler limits. Domain allow-listing is disabled; public http/https URLs are accepted.
url.block-private-hosts=true
url.max-pages=20
url.max-depth=2
url.timeout=15s
url.retry-attempts=3
url.retry-backoff=500ms
url.max-extracted-chars=180000
url.trafilatura.enabled=false
url.trafilatura.command=trafilatura
url.trafilatura.timeout=20s

# Optional login-required URL support. Password stays backend-only.
secure-url.login-enabled=false
secure-url.login-url=${SECURE_URL_LOGIN_URL:}
secure-url.username=${SECURE_URL_USERNAME:}
secure-url.password=${SECURE_URL_PASSWORD:}
secure-url.username-selector=input[name='username']
secure-url.password-selector=input[name='password']
secure-url.submit-selector=button[type='submit']
