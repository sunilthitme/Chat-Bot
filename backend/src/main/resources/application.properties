# Application name shown in logs.
spring.application.name=internal-chatbot

# H2 in-memory database. Data resets every application restart.
spring.datasource.url=jdbc:h2:mem:chatbotdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Create tables automatically from JPA entities for the base version.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Load sample data after Hibernate creates the table.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Enables browser console at http://localhost:8080/h2-console.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Backend server port.
server.port=8080

# Store application logs in one text file at backend/system.out.logs.
logging.file.name=system.out.logs
logging.level.com.example.internalchatbot=INFO
