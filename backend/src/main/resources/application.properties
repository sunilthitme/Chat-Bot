# Application name shown in logs.
spring.application.name=internal-chatbot

# H2 file database for local persistence. Switch to MySQL/PostgreSQL in production.
spring.datasource.url=jdbc:h2:file:./data/chatbotdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Keep persisted local knowledge instead of recreating tables on every restart.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Load sample data after Hibernate creates the table.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Enables browser console at http://localhost:8080/h2-console.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Backend server port.
server.port=8080
server.tomcat.connection-timeout=30s
spring.mvc.async.request-timeout=240s

# Frontend origin allowed to call backend APIs.
app.cors.allowed-origin=http://localhost:4200

# Ollama LLM integration. Keep Ollama running locally on the configured URL.
ollama.enabled=true
ollama.base-url=http://localhost:11434
ollama.url=${ollama.base-url}/api/generate
ollama.model=phi3:mini
# Faster alternate for larger local machines: llama3:8b-instruct-q4_0
ollama.embedding-url=${ollama.base-url}/api/embeddings
ollama.embedding-model=nomic-embed-text
ollama.embedding-timeout=45s
ollama.connect-timeout=5s
ollama.request-timeout=240s
ollama.temperature=0.2
ollama.num-predict=384
ollama.num-ctx=4096
ollama.retry-attempts=2
ollama.retry-backoff=500ms

# RAG vector storage. Chroma is attempted first; local DB vectors keep the app resilient for development.
rag.top-k=5
rag.candidate-top-k=30
rag.local-candidate-limit=800
rag.allow-global-retrieval=false
rag.chunk-size=800
rag.chunk-overlap=150
rag.min-score=0.05
rag.max-context-chars=4500
rag.max-chunk-context-chars=1000
rag.embedding-batch-size=12
rag.embedding-cache-size=512

# Chat runtime guardrails: bounded search, one generation call, and long enough SSE for local Ollama.
chat.internal-search-limit=3
chat.answer-cache-size=256
chat.request-timeout=240s
chat.sse-timeout=240s
chat.memory.max-chars=1800
chat.memory.retrieval-query-chars=600
ingestion.summary.max-input-chars=6000
chroma.enabled=true
chroma.base-url=http://localhost:8000
chroma.collection-name=internal_chatbot_knowledge
chroma.tenant-name=default
chroma.database-name=default
chroma.timeout=10s
chroma.health-check-timeout=2s
chroma.health-check-retries=3
chroma.retry-delay=30s
chroma.log-requests=false
chroma.log-responses=false

# Upload guardrails.
security.max-upload-bytes=10485760

# URL ingestion crawler limits. Domain allow-listing is disabled; public http/https URLs are accepted.
url.block-private-hosts=true
url.max-pages=20
url.max-depth=2
url.timeout=15s
url.retry-attempts=3
url.retry-backoff=500ms
url.max-extracted-chars=180000
url.trafilatura.enabled=false
url.trafilatura.command=trafilatura
url.trafilatura.timeout=20s

# Optional login-required URL support. Password stays backend-only.
secure-url.login-enabled=false
secure-url.login-url=${SECURE_URL_LOGIN_URL:}
secure-url.username=${SECURE_URL_USERNAME:}
secure-url.password=${SECURE_URL_PASSWORD:}
secure-url.username-selector=input[name='username']
secure-url.password-selector=input[name='password']
secure-url.submit-selector=button[type='submit']
